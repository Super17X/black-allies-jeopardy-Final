<!doctype html>
<html lang="en" class="phone-command">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>VA MDE Triage • Mission Controller</title>
  <style>
    :root {
      --bg: #07060a;
      --panel: #0d0b14;
      --border: #3a2c00;
      --gold: #f7c948;
      --gold2: #ffdf6e;
      --text: #fff7d6;
      --muted: #e9d8a6;
      --danger: #ff6b6b;
      --ok: #7CFC98;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: radial-gradient(800px 600px at 50% 0%, #11102b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    h1 { color: var(--gold2); margin: 0 0 6px; font-size: 1.6rem; }
    .sub { color: var(--muted); font-size: .95rem; margin: 0 0 24px; }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, #0b0a10 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 400px;
    }
    input {
      width: 100%;
      background: #0a0910;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 1.1rem;
      margin-bottom: 14px;
    }
    input::placeholder { color: #665d40; }
    .btn {
      width: 100%;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #1a1526 0%, #0e0b14 100%);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .btn.ok { border-color: #5a4200; background: linear-gradient(180deg,#2a2100 0%,#141000 100%); color: var(--gold2); }


    /* --- Buzzer button --- */
    #buzzerBtn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 6px solid #8b6a00;
      background: radial-gradient(circle at 38% 32%, #ffea80 0%, #f7c948 40%, #c8920a 100%);
      color: #1a1200;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: .5px;
      cursor: pointer;
      box-shadow: 0 0 60px rgba(247,201,72,.55), 0 8px 32px rgba(0,0,0,.6);
      transition: transform .08s ease, box-shadow .08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0 auto;
      position: relative;
    }
    #buzzerBtn:active, #buzzerBtn.pressed {
      transform: scale(.92);
      box-shadow: 0 0 30px rgba(247,201,72,.35), 0 2px 8px rgba(0,0,0,.6);
    }
    #buzzerBtn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }


    #loginSection { display: block; }
    #buzzerSection { display: none; flex-direction: column; align-items: center; gap: 20px; }


    #statusMsg {
      font-size: 1rem;
      color: var(--muted);
      min-height: 1.4em;
    }
    #statusMsg.ok { color: var(--ok); }
    #statusMsg.err { color: var(--danger); }


    #playerLabel { color: var(--gold2); font-size: 1.1rem; font-weight: 700; margin: 0; }
    #questionInfo {
      font-size: .95rem;
      color: var(--muted);
      min-height: 1.2em;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0a0910;
      width: 100%;
      max-width: 340px;
    }
    #answerArea { display:none; width:100%; max-width:340px; }
    #answerArea input { margin-bottom:10px; text-align:center; }
    #controlBanner{width:100%;max-width:360px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#100d05;color:var(--gold2);font-weight:800;text-align:center}
    #mobileBoard{display:none;width:100%;max-width:390px}
    #mobileBoardGrid{display:grid;gap:6px;overflow-x:auto}
    .mcat{font-size:.72rem;font-weight:800;color:var(--gold2);padding:6px 2px;text-align:center}
    .mclue{padding:10px 4px;border:1px solid var(--border);border-radius:8px;background:#111;color:var(--gold2);font-weight:800;min-width:72px}
    .mclue:disabled{opacity:.25}
    #finalMobile{display:none;width:100%;max-width:360px;border-top:1px solid var(--border);padding-top:14px}
    #finalMobile input{margin:8px 0;text-align:center}
    #finalClueMobile{font-size:1.05rem;line-height:1.4;margin:10px 0;color:#fff}


    /* Ripple flash overlay */
    #buzzerFlash {
      position: fixed; inset: 0;
      background: rgba(247,201,72,0);
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease-out;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      font-weight: 900;
    }
    #buzzerFlash .flash-label {
      opacity: 0;
      transform: scale(.4);
      transition: opacity .18s ease, transform .18s ease;
      color: var(--gold2);
      text-shadow: 0 0 30px rgba(247,201,72,.9);
    }
  </style>
<link rel="stylesheet" href="assets/command-ui.css" /></head>
<body><img class="phone-guile" src="assets/guile-command.png" alt="Guile mission commander" /><div class="phone-hud"><span id="phonePhase">LOBBY</span><b id="phoneTimer">—</b><span id="phoneConnection">CONNECTING</span><span id="phoneLatency">—ms relay</span></div><div class="phone-mission">SQUAD COMMUNICATIONS / VA MDE TRIAGE</div>
  <div id="buzzerFlash"><span class="flash-label">BUZZ!</span></div>


  <h1>VA MDE Triage Jeopardy</h1>
  <p class="sub">Join the game and hit the buzzer to answer!</p>
  <p id="roomLabel" class="sub" style="color:var(--gold2);margin-top:-8px">Room: —</p>


  <!-- Login -->
  <div class="card" id="loginSection">
    <input id="nameInput" placeholder="Enter your player name" autocomplete="off" spellcheck="false" />
    <div id="loginError" style="color:var(--danger);font-size:.88rem;margin-bottom:10px;min-height:1.2em"></div>
    <button class="btn ok" id="joinBtn">Join Game</button>
  </div>


  <!-- Buzzer -->
  <div class="card" id="buzzerSection" style="display:none">
    <p id="playerLabel">—</p>
    <button class="btn ok" id="phoneReady">Mark ready</button><div id="controlBanner">In control: —</div>
    <div id="mobileBoard">
      <div class="sub" style="margin:0 0 8px">Available clues — the player in control can select.</div>
      <div id="mobileBoardGrid"></div>
    </div>
    <div id="questionInfo">Waiting for a question…</div>
    <div style="margin:20px 0">
      <button id="buzzerBtn" disabled>BUZZ!</button>
    </div>
    <div id="statusMsg"></div>
    <div id="answerArea">
      <input id="remoteAnswerInput" placeholder="Type your answer" autocomplete="off" spellcheck="false" aria-label="Your answer" />
      <button class="btn" id="phonePass">Pass objective</button><button class="btn ok" id="submitAnswerBtn">Submit Answer</button>
      <div class="sub" style="margin:0">Capitalization does not matter.</div>
    </div>
    <div id="phoneGuileMessage" class="mission-help" aria-live="polite"></div><button class="btn" id="requestSync">Refresh connection</button><div id="phoneScores" aria-label="Live rankings"></div><div id="finalMobile">
      <div id="finalCategoryMobile" style="color:var(--gold2);font-weight:800"></div>
      <div id="finalClueMobile"></div>
      <input id="finalWagerInput" type="number" min="0" step="1" placeholder="Final Jeopardy wager" />
      <button class="btn ok" id="finalWagerBtn">Submit Wager</button>
      <input id="finalAnswerInput" placeholder="Final Jeopardy answer" autocomplete="off" spellcheck="false" style="display:none" />
      <button class="btn ok" id="finalAnswerBtn" style="display:none">Submit Final Answer</button>
      <div id="finalStatusMobile" class="sub" style="margin-top:8px"></div>
    </div>
    <div style="margin-top:10px">
      <button class="btn" id="leaveBtn" style="font-size:.85rem;padding:8px">Leave Game</button>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/mission-core.js"></script>
<script src="assets/player-game.js"></script>
</body>
</html>
